name: ewao-wordpress

services:
  db:
    image: mariadb:10.11
    container_name: ewao_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-ewaoproject}
      MARIADB_USER: ${DB_USER:-ewaoproject}
      MARIADB_PASSWORD: ${DB_PASSWORD:-idina123*A}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - ewao

  wordpress:
    image: wordpress:7.1.2-php8.4-apache
    container_name: ewao_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8082}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER:-ewaoproject}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-idina123*A}
      WORDPRESS_DB_NAME: ${DB_NAME:-ewaoproject}
    volumes:
      - ./html:/var/www/html
    networks:
      - ewao

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ewao_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    networks:
      - ewao

  # Servicio de herramientas WP-CLI. No arranca con "up":
  # se usa con: docker compose run --rm wpcli <comando>
  wpcli:
    image: wordpress:cli-2.11-php8.4
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER:-ewaoproject}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-idina123*A}
      WORDPRESS_DB_NAME: ${DB_NAME:-ewaoproject}
    user: "33:33"
    volumes:
      - ./html:/var/www/html
    networks:
      - ewao

volumes:
  db_data:

networks:
  ewao:
